# Confluence / 汇流 — example user overrides
#
# These are EXAMPLES for a user's own profile layer
# ($DSH_HOME/profiles/<profile>/cordis.patch.yml). Nothing here is loaded by the
# repository, the bundle, or the tests.
#
# Row matching: later layers win per row, and a matching override REPLACES the
# row's complete `config` object instead of deep-merging it. That is why each
# example below repeats the full v1 configuration — copy one block and change
# only the fields you care about. The bundle's own defaults are in
# ../cordis.patch.yml; the field-by-field contract is docs/design/config.md.
#
# At design stage the scaffold has no behaviour, so overrides only change the
# single activation warning. The examples describe the intended v1 semantics.

# ---------------------------------------------------------------------------
# Example 1 — privacy first: fewer headlines, no file hints, opt-outs.
# Use when a workspace may contain sensitive material and you want the minimum
# ambient surface.
# ---------------------------------------------------------------------------
- id: confluence
  name: dsh-confluence
  config:
    enabled: true
    store:
      dir: ''
      retentionDays: 30
      maxEntriesPerWorkspace: 500
      maxBodyBytes: 4096
      pollMs: 4000
      watch: true
    pulse:
      enabled: true
      maxHeadlines: 1
      maxPeers: 1
      maxChars: 800
    ledger:
      enabled: true
      maxFilesPerSession: 0
      maxSessionsPerWorkspace: 50
      fileHintsInPulse: false
    recall:
      enabled: false
      maxSessions: 1
      maxHits: 2
      timeoutMs: 3000
    privacy:
      redact: true
      redactTitles: true
      denyPathPatterns:
        - '**/.env*'
        - '**/*.pem'
        - '**/secrets/**'
      privateSessions: []
      disabledWorkspaces: []
    ui:
      enabled: true
      pollMs: 5000
    export:
      enabled: false
      dir: '.confluence/export'
    debug:
      logFile: ''

# ---------------------------------------------------------------------------
# Example 2 — low noise: turn the passive surfaces off, keep explicit tools.
# The agent can still read/write the board when asked; nothing is injected and
# no presence is advertised. Useful while the team is still calibrating trust
# in the pulse.
# ---------------------------------------------------------------------------
- id: confluence
  name: dsh-confluence
  config:
    enabled: true
    store:
      dir: ''
      retentionDays: 90
      maxEntriesPerWorkspace: 2000
      maxBodyBytes: 8192
      pollMs: 4000
      watch: true
    pulse:
      enabled: false
      maxHeadlines: 3
      maxPeers: 2
      maxChars: 1400
    ledger:
      enabled: false
      maxFilesPerSession: 8
      maxSessionsPerWorkspace: 200
      fileHintsInPulse: false
    recall:
      enabled: true
      maxSessions: 3
      maxHits: 5
      timeoutMs: 5000
    privacy:
      redact: true
      redactTitles: true
      denyPathPatterns:
        - '**/.env*'
        - '**/*.pem'
      privateSessions: []
      disabledWorkspaces: []
    ui:
      enabled: false
      pollMs: 5000
    export:
      enabled: false
      dir: '.confluence/export'
    debug:
      logFile: ''

# ---------------------------------------------------------------------------
# Example 3 — debugging a store/pulse problem on one machine.
# Faster polling, a dedicated debug log outside the workspace, and a custom
# store directory under DSH_HOME. Keep logFile out of version control and never
# point it at a directory that contains session content.
# ---------------------------------------------------------------------------
- id: confluence
  name: dsh-confluence
  config:
    enabled: true
    store:
      dir: 'C:\Users\<you>\.dsh\storages\confluence\debug-v1'
      retentionDays: 7
      maxEntriesPerWorkspace: 200
      maxBodyBytes: 8192
      pollMs: 1000
      watch: false
    pulse:
      enabled: true
      maxHeadlines: 3
      maxPeers: 2
      maxChars: 1400
    ledger:
      enabled: true
      maxFilesPerSession: 8
      maxSessionsPerWorkspace: 200
      fileHintsInPulse: false
    recall:
      enabled: true
      maxSessions: 3
      maxHits: 5
      timeoutMs: 5000
    privacy:
      redact: true
      redactTitles: true
      denyPathPatterns:
        - '**/.env*'
        - '**/*.pem'
      privateSessions: []
      disabledWorkspaces: []
    ui:
      enabled: true
      pollMs: 5000
    export:
      enabled: false
      dir: '.confluence/export'
    debug:
      logFile: 'C:\Users\<you>\.dsh\logs\confluence-debug.log'
