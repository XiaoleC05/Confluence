# Confluence / 汇流 — bundle patch (v0.2.0 universal memory)
#
# Installing this bundle inserts exactly one Loader row, `confluence`, whose
# `config` is the complete v1 default configuration. The row mounts the plain
# ESM host plugin in ./index.js (six tools, one passive pulse, read-only panel
# routes, opt-in export CLI) and, when DSH exposes a Web client, the sidebar/
# panel client in ./client.js.
#
# v0.2.0 scope (ADR-0007): ONE universal profile-wide shared memory for every
# session, regardless of working directory. The workspace is provenance only;
# there is no per-workspace isolation switch. Legacy v0.1.0 per-workspace
# journals stay on disk and are merged read-only into every view.
#
# Binding design:
#   docs/adr/0007-universal-memory-scope.md   v0.2.0 scope decision
#   docs/adr/0001-confluence-architecture.md  architecture, config family
#   docs/design/config.md                     configuration contract
#   docs/plan/scope-refactor-delta.md         binding interface delta
#
# A user override in the profile's own cordis.patch.yml replaces this complete
# `config` object rather than deep-merging it. Copy the whole block and change
# only what you need; ready-made examples: examples/profile-patch.yml.
- insert:
    - id: confluence
      name: dsh-confluence
      config:
        # Master switch. false keeps the row mounted but makes every Confluence
        # feature a no-op.
        enabled: true

        # Store: profile-local, append-only JSONL journals (ADR §6).
        store:
          # Empty string = $DSH_HOME/storages/confluence/v1. An absolute path is
          # accepted but discouraged; relative paths resolve against the
          # profile's storage area. The plugin never writes inside the
          # workspace by default.
          dir: ''
          # Journal records older than this become eligible for M4 compaction.
          retentionDays: 90
          # Hard cap on visible shared-memory entries enforced at the write boundary.
          # (The historical config key name is kept for compatibility.)
          maxEntriesPerWorkspace: 2000
          # Maximum serialized size of one board note body, in bytes.
          maxBodyBytes: 8192
          # Freshness contract: readers poll this often. fs.watch is only an
          # optimization and must degrade to polling.
          pollMs: 4000
          # Best-effort fs.watch acceleration (debounced, try/catch wrapped).
          watch: true

        # Pulse: the passive, byte-stable universal shared-memory digest injected through one
        # global systemPrompt.context contribution (ADR §8).
        pulse:
          enabled: true
          # Unread board headlines rendered per step (design maximum 3).
          maxHeadlines: 3
          # Live peer session titles rendered per step (design maximum 2).
          maxPeers: 2
          # Hard character cap for the rendered pulse (200–320 token target).
          maxChars: 1400

        # Ledger: metadata-only, live-first session awareness across the profile (ADR-0007).
        ledger:
          enabled: true
          # Distinct workspace-relative paths recorded per session.
          maxFilesPerSession: 8
          # Session-ledger rows retained in the global journal.
          maxSessions: 200
          # File hints are deliberately never rendered in the pulse (privacy).
          fileHintsInPulse: false

        # Recall: explicit, read-only, literal search over ALL earlier sessions
        # in the profile through ctx.sessionQuery exact reads (ADR-0007 §2.4;
        # workspace directories are provenance only, not a filter).
        recall:
          enabled: true
          # Prior sessions searched per call.
          maxSessions: 3
          # Matching events returned per call across sessions.
          maxHits: 5
          # Cooperative timeout for one recall call.
          timeoutMs: 5000

        # Privacy: the DSH profile/machine is the shared-memory boundary
        # (single-user local; ADR-0007). These are best-effort user controls,
        # not a sandbox (ADR §11).
        privacy:
          # Redact API keys, tokens, private keys and password-like values.
          redact: true
          # Redact titles as well (titles are derived from prompts).
          redactTitles: true
          # Glob patterns whose path hints are never recorded.
          denyPathPatterns:
            - '**/.env*'
            - '**/*.pem'
          # Session ids that never contribute ledger rows, pulse text or tools.
          privateSessions: []
          # Custom redaction regex sources applied after the built-in secret
          # patterns (design/config.md §2.4; addition beyond ADR §10). Built-ins
          # cannot be disabled. Invalid patterns are dropped with a warning.
          redactPatterns: []

        # UI: read-only Web panel (sidebar list + main timeline, provenance
        # chips, search/kind filter, live peers). No writes from the browser.
        ui:
          enabled: true
          # Panel refresh interval while visible.
          pollMs: 5000

        # Export: opt-in, explicit user action, deterministic and redacted.
        # v0.2.0 CLI writes the universal memory export under
        # /storages/confluence-exports/<stamp>/ by default (scripts/export-memories.mjs).
        export:
          enabled: false
          dir: '.confluence/export'

        # Debug: empty string = no debug log file; M1 wires the writer.
        debug:
          logFile: ''
